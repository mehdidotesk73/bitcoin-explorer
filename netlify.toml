# Netlify build config — preview deploys only.
#
# Production is GitHub Pages (.github/workflows/deploy.yml). Netlify builds a
# Deploy Preview for every pull request (deploy-preview-<n>--bitcoin-1460.netlify.app);
# branch deploys are off in the Netlify UI, and the `data` branch is ignored
# below as a second guard.
#
# Note: BASE_PATH is intentionally NOT set here. GitHub Pages serves this app
# from /<repo-name>/, but Netlify serves it from the site root, so the Vite
# `base` must stay "/" (its default when BASE_PATH is unset).

[build]
  # Pull the app-owned price snapshot from the `data` branch (maintained by
  # .github/workflows/data-refresh.yml) so previews have fresh data too. Never
  # fatal: without it the app falls back to the CSV + full live fetch.
  command = '(curl -fsSL --max-time 30 -o public/data/btc-daily.json https://raw.githubusercontent.com/mehdidotesk73/bitcoin-explorer/data/btc-daily.json || (rm -f public/data/btc-daily.json; echo "no data snapshot: building without it")) && npm run build'
  publish = "dist"
  # Exit 0 = skip the build: never build the data branch itself.
  ignore = '[ "$BRANCH" = "data" ]'

[build.environment]
  NODE_VERSION = "20"

# Single-page app: send unknown paths to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
